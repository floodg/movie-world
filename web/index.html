<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Movie World</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="top">
    <p class="brand">Movie World</p>
    <div class="search-fields">
      <form id="search" class="search" role="search">
        <label class="visually-hidden" for="title-search">Search by title</label>
        <input id="title-search" type="search" placeholder="Search by title" autocomplete="off" enterkeyhint="search" maxlength="80">
      </form>
      <form id="actor-search" class="search" role="search">
        <label class="visually-hidden" for="actor-query">Search by actor</label>
        <input id="actor-query" type="search" placeholder="Search by actor" autocomplete="off" enterkeyhint="search" maxlength="80">
      </form>
    </div>
    <div class="top-actions">
      <p class="tagline">Genres, highest rated first</p>
      <div class="header-tools">
        <div class="year-filter" id="year-filter">
          <button type="button" id="year-filter-open" class="filter-btn" aria-haspopup="dialog" aria-expanded="false" aria-controls="year-filter-panel">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M4 7h16M4 12h16M4 17h16"/>
              <circle cx="9" cy="7" r="2.2" fill="currentColor"/>
              <circle cx="15" cy="12" r="2.2" fill="currentColor"/>
              <circle cx="8" cy="17" r="2.2" fill="currentColor"/>
            </svg>
            <span class="visually-hidden">Year filter</span>
            <span id="year-filter-summary" class="filter-summary" hidden></span>
          </button>
          <div id="year-filter-panel" class="year-panel" role="dialog" aria-label="Year filter" hidden>
            <p class="year-panel-title">Year</p>
            <div id="decade-grid" class="decade-grid" role="group" aria-label="Decades"></div>
            <p class="year-hint">Or add one year, or a from–to range.</p>
            <form id="year-range-form" class="year-range-form">
              <div class="year-range-fields">
                <label>From
                  <input id="year-from" inputmode="numeric" maxlength="4" placeholder="1984" autocomplete="off">
                </label>
                <label>To
                  <input id="year-to" inputmode="numeric" maxlength="4" placeholder="1989" autocomplete="off">
                </label>
                <button type="submit">Add</button>
              </div>
              <p id="year-range-error" class="year-range-error" hidden></p>
            </form>
            <div id="year-ranges" class="year-ranges"></div>
            <button type="button" id="year-filter-clear" class="year-clear" hidden>Clear years</button>
          </div>
        </div>
        <button type="button" id="favourites-jump" class="fav-link">
          Favourites
          <span id="favourites-count">0</span>
        </button>
      </div>
    </div>
  </header>
  <main>
    <section id="results" class="results" hidden aria-live="polite"></section>
    <section id="favourites" class="favourites" aria-labelledby="favourites-heading"></section>
    <section id="genres" class="genre-grid" aria-label="Genres"></section>
    <section id="rail" class="rail" hidden aria-live="polite"></section>
  </main>
  <footer class="credit">
    This product uses the TMDB API but is not endorsed or certified by TMDB.
  </footer>
  <dialog id="detail" aria-label="Movie details"></dialog>
  <script src="/tvcast.js"></script>
  <script src="/app.js"></script>
</body>
</html>
